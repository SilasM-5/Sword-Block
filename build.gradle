package eu.midnightdust.swordblocking.config;

import com.google.gson.Gson;
import com.google.gson.GsonBuilder;
import com.google.gson.JsonObject;
import net.fabricmc.loader.api.FabricLoader;

import java.io.IOException;
import java.nio.file.Files;
import java.nio.file.Path;

/**
 * Minimal config: edit config/swordblocking.json and restart the game.
 * (The original uses MidnightLib for an in-game screen; it is left out here so the port has no extra dependency.)
 */
public final class SwordBlockingConfig {
    public static boolean enabled = true;
    public static boolean hideShield = true;
    public static boolean alwaysHideShield = true;
    public static boolean hideOffhandSlot = false;
    public static boolean disableUseEquipAnimation = false;
    public static boolean lockBlockingArmPosition = false;
    public static boolean blockHitAnimation = false;

    private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

    private SwordBlockingConfig() {
    }

    public static void load() {
        final Path file = FabricLoader.getInstance().getConfigDir().resolve("swordblocking.json");
        try {
            if (Files.exists(file)) {
                final JsonObject json = GSON.fromJson(Files.readString(file), JsonObject.class);
                if (json != null) {
                    enabled = bool(json, "enabled", enabled);
                    hideShield = bool(json, "hideShield", hideShield);
                    alwaysHideShield = bool(json, "alwaysHideShield", alwaysHideShield);
                    hideOffhandSlot = bool(json, "hideOffhandSlot", hideOffhandSlot);
                    disableUseEquipAnimation = bool(json, "disableUseEquipAnimation", disableUseEquipAnimation);
                    lockBlockingArmPosition = bool(json, "lockBlockingArmPosition", lockBlockingArmPosition);
                    blockHitAnimation = bool(json, "blockHitAnimation", blockHitAnimation);
                }
            }
            save(file);
        } catch (IOException | RuntimeException e) {
            System.err.println("[SwordBlocking] Could not read config, using defaults: " + e);
        }
    }

    private static boolean bool(JsonObject json, String key, boolean fallback) {
        return json.has(key) && json.get(key).isJsonPrimitive() ? json.get(key).getAsBoolean() : fallback;
    }

    private static void save(Path file) throws IOException {
        final JsonObject json = new JsonObject();
        json.addProperty("enabled", enabled);
        json.addProperty("hideShield", hideShield);
        json.addProperty("alwaysHideShield", alwaysHideShield);
        json.addProperty("hideOffhandSlot", hideOffhandSlot);
        json.addProperty("disableUseEquipAnimation", disableUseEquipAnimation);
        json.addProperty("lockBlockingArmPosition", lockBlockingArmPosition);
        json.addProperty("blockHitAnimation", blockHitAnimation);
        Files.createDirectories(file.getParent());
        Files.writeString(file, GSON.toJson(json));
    }
}


