package eu.midnightdust.swordblocking.mixins;

import com.llamalad7.mixinextras.injector.ModifyExpressionValue;
import eu.midnightdust.swordblocking.SwordBlockingClient;
import eu.midnightdust.swordblocking.config.SwordBlockingConfig;
import net.minecraft.client.gui.Hud;
import net.minecraft.world.item.ItemStack;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.injection.At;

/** In 26.2 the hotbar code lives in Hud (it used to be in Gui) and is called extractItemHotbar. */
@Mixin(Hud.class)
public abstract class MixinHud {
    @ModifyExpressionValue(
            method = "extractItemHotbar",
            at = @At(value = "INVOKE", target = "Lnet/minecraft/world/entity/player/Player;getOffhandItem()Lnet/minecraft/world/item/ItemStack;"),
            require = 0
    )
    private ItemStack swordBlocking$hideOffHandSlot(ItemStack original) {
        if (SwordBlockingConfig.enabled && SwordBlockingConfig.hideOffhandSlot && SwordBlockingClient.isShield(original)) {
            return ItemStack.EMPTY;
        }
        return original;
    }
}


